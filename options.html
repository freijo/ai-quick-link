<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Quick Link Settings</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 0; margin: 0; width: 420px; background-color: #f9fafb; color: #1f2937; }
    .container { padding: 20px; background: white; min-height: 100vh; box-sizing: border-box;}
    h1 { font-size: 18px; margin-top: 0; margin-bottom: 20px; color: #111827; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; }
    
    .section { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
    .section-title { font-size: 14px; font-weight: bold; color: #334155; margin-bottom: 10px; display: block; border-bottom: 1px dashed #e2e8f0; padding-bottom: 5px; }
    
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; color: #475569; }
    select, textarea, input[type="text"] { width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #cbd5e1; background-color: #fff; font-size: 13px; box-sizing: border-box; font-family: inherit; margin-bottom: 8px; }
    textarea { resize: vertical; min-height: 50px; }
    button { padding: 6px 12px; background-color: #2563EB; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 500; font-size: 13px; }
    button:hover { background-color: #1d4ed8; }
    
    .shortcut-wrapper { display: flex; gap: 10px; align-items: center; }
    #currentShortcut { background-color: #f1f5f9; color: #64748b; cursor: not-allowed; text-align: center; width: 100px;}
    
    .list-container { margin-top: 10px; }
    .list-item { background: #f8fafc; border: 1px solid #e2e8f0; padding: 8px; border-radius: 5px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
    .list-info { font-size: 12px; overflow: hidden; }
    .btn-delete { background-color: #ef4444; padding: 4px 8px; font-size: 11px; margin-left: 5px;}
    .btn-delete:hover { background-color: #dc2626; }

    .hint { font-size: 11px; color: #94a3b8; margin-top: -4px; margin-bottom: 10px; }
    #status { height: 20px; font-size: 13px; text-align: center; color: #059669; font-weight: 500; margin-top: 10px; }
    
    .footer { margin-top: 20px; font-size: 12px; color: #9ca3af; text-align: center; border-top: 1px solid #f3f4f6; padding-top: 15px; }
    
    /* NEU: Ko-fi Icon-Button Style */
    .kofi-button {
      display: inline-flex; /* Flexbox für Zentrierung */
      align-items: center;
      justify-content: center;
      background-color: #FF5E5B; /* Ko-fi Rot */
      padding: 8px; /* Kompaktes Padding */
      border-radius: 50%; /* Runder Button */
      margin-top: 10px;
      transition: transform 0.2s, opacity 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 4px rgba(255, 94, 91, 0.3);
      text-decoration: none; /* Wichtig für Links */
      line-height: 0; /* Verhindert zusätzlichen Platz unter dem Bild */
    }
    .kofi-button img {
      width: 24px; /* Größe des Icons */
      height: 24px;
      display: block; /* Verhindert unerwünschte Abstände */
    }
    .kofi-button:hover {
      transform: translateY(-2px); /* Leichter Hebe-Effekt */
      opacity: 0.95;
      box-shadow: 0 4px 8px rgba(255, 94, 91, 0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 data-i18n="optionsTitle">AI Quick Link</h1>
    
    <div class="section">
      <span class="section-title" data-i18n="lblProvider">KI-Assistent</span>
      <select id="provider"></select>

      <details>
        <summary style="font-size:12px; cursor:pointer; color:#2563EB; margin-bottom:5px;" data-i18n="lblCustomProviders">Eigene Anbieter...</summary>
        <div style="background:#f1f5f9; padding:10px; border-radius:5px; margin-top:5px;">
          <input type="text" id="newProviderName" placeholder="Name">
          <input type="text" id="newProviderUrl" placeholder="URL">
          <button id="addProvider" data-i18n="btnAdd" style="width:100%">+</button>
          <div id="customList" class="list-container"></div>
        </div>
      </details>
    </div>

    <div class="section">
      <span class="section-title" data-i18n="lblQuickPrompts">Kontext-Menü</span>
      <div class="hint" data-i18n="hintQuick">Füge Einträge für das Rechtsklick-Menü hinzu.</div>
      
      <input type="text" id="quickName" placeholder="Name">
      <textarea id="quickPrefix" placeholder="Prefix" style="min-height:40px;"></textarea>
      <textarea id="quickSuffix" placeholder="Suffix" style="min-height:40px;"></textarea>
      <button id="addQuickPrompt" data-i18n="btnAdd" style="width:100%">Eintrag hinzufügen</button>

      <div id="quickPromptList" class="list-container"></div>
    </div>

    <div class="section">
      <span class="section-title" data-i18n="lblGlobalSettings">Standard-Aktion</span>
      
      <div class="shortcut-wrapper" style="margin-bottom:10px;">
        <label data-i18n="lblHotkey" style="margin:0;">Hotkey:</label>
        <input type="text" id="currentShortcut" value="..." readonly>
        <button id="changeShortcut" data-i18n="btnChangeHotkey">Change</button>
      </div>

      <label data-i18n="lblPrefix">Prefix:</label>
      <textarea id="customPrefix" placeholder="..."></textarea>
      
      <label data-i18n="lblSuffix">Suffix:</label>
      <textarea id="customSuffix" placeholder="..."></textarea>
    </div>

    <div id="status"></div>
    
    <div class="footer">
      <div data-i18n="footerText">Einstellungen werden automatisch gespeichert.</div>
      
      <a href="https://ko-fi.com/johannesfrei" target="_blank" class="kofi-button" aria-label="Support on Ko-fi">
        <img src="icon_kofi.png" alt="Ko-fi Tasse">
      </a>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
