name: Release AI Quick Link Extension
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Zip Extension
        run: |
          zip -r ai-quick-link-extension.zip . -x ".git/*" ".github/*"
      - uses: softprops/action-gh-release@v1
        with:
          files: ai-quick-link-extension.zip
          generate_release_notes: true
      - name: Publish to Chrome Web Store (optional)
        if: false  # Enable with secrets
        env:
          CHROME_WEBSTORE_TOKEN: ${{ secrets.CHROME_WEBSTORE_TOKEN }}
        run: |
          curl -s -X POST \
            -H "x-goog-api-version: 2" \
            -H "Authorization: Bearer $CHROME_WEBSTORE_TOKEN" \
            -F "uploadSource=@ai-quick-link-extension.zip" \
            https://www.googleapis.com/upload/chromewebstore/v1.1/items/YOUR_EXTENSION_ID
      - name: Telegram Deploy Notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="✅ Released AI Quick Link v${{ github.ref_name }}: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
